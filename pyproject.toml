[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pigeon-tg-vk"
version = "0.1.0"
description = "Bidirectional bridge between VK and Telegram"
requires-python = ">=3.14,<3.15"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
authors = [{name = "Alexandr Lyashok"}]

dependencies = [
    "aiogram",
    "vkbottle",
    "SQLAlchemy",
    "asyncpg",
    "python-dotenv",
    "alembic"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pigeon_tg_vk"]